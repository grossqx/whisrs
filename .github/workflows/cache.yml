name: cache

on:
  push:
    branches: [main, "feat/*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v15
        with:
          name: whisrs-fork
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # Build the flake package; cachix-action pushes every path built in
      # this job to the cache, so Andrii's home-manager switch substitutes
      # the fork build instead of compiling it locally.
      - name: Build
        run: nix build .#default
        timeout-minutes: 90
